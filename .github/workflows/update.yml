name: 上場維持基準 監視サイト 自動更新

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      target_month:
        description: '対象月（例: 3 = 3月決算銘柄を優先表示）空欄=当月'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリをインストール
        run: |
          pip install pandas requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice

      - name: データ取得・HTML生成
        run: |
          MONTH="${{ github.event.inputs.target_month }}"
          if [ -n "$MONTH" ]; then
            python generate.py $MONTH
          else
            python generate.py
          fi

      - name: 更新ファイルをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "自動更新: $(date '+%Y年%m月%d日 %H:%M')"
          git push
