<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東証 上場維持基準 監視サイト</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f5f7; }
    .box { text-align: center; background: #fff; padding: 48px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 12px; }
    p { color: #666; font-size: 14px; }
    .spinner { margin: 24px auto; width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #1565c0; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <h1>📊 東証 上場維持基準 監視サイト</h1>
    <div class="spinner"></div>
    <p>初回データ取得中です。<br>GitHub Actionsを実行してください。<br>数分後に自動的に更新されます。</p>
  </div>
</body>
</html>
